# SonarQube Cloud analysis for the frontend.
#
# The frontend is a separate SonarQube project from the backend. The backend is
# analysed by the SonarScanner for .NET, which derives its file list from the
# MSBuild projects and therefore never sees anything under frontend/. Splitting
# the two means each stack is scanned by the scanner that understands it.
#
# Run from this directory, after `pnpm vitest run --coverage`:
#   pnpm dlx sonarqube-scanner
sonar.projectKey=stu640978_struo-cms_frontend
sonar.organization=stu640978
sonar.sourceEncoding=UTF-8

# vitest specs live next to the code they cover under src/, so the split is
# spelled out from both sides: specs are excluded from sources and included as
# tests. Leaving a directory in both sets without an explicit carve-out makes
# the scanner index nothing.
sonar.sources=src
sonar.tests=src,tests,e2e
# components/ui/** is vendored shadcn output (frontend/src/components/ui/ is read-only by
# project rule — no edits, no :deep() into it). Issues raised in there can never be fixed, so
# it must not enter the project as scannable/coverable first-party source.
sonar.exclusions=**/*.test.ts,**/*.spec.ts,src/components/ui/**
sonar.coverage.exclusions=src/components/ui/**
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,tests/**,e2e/**

# The two locale files are structural mirrors of each other by project rule: en.ts and
# zh-TW.ts must carry an identical key hierarchy, in the same order, with every key present
# in both. CPD tokenises string literals generically, so it sees ~330 duplicated lines
# spanning the whole of both files — and any change that satisfied it would have to break
# the parity requirement it is reporting. Excluding them is the only honest resolution; it
# does not weaken any other check, since exclusions here are CPD-only.
sonar.cpd.exclusions=src/locales/**

# Written by `pnpm vitest run --coverage` (provider v8, reportsDirectory ./coverage).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Without this the scanner indexes ZERO files here ("0 languages detected in 0
# preprocessed files"): every file under frontend/ is dropped as SCM-ignored,
# even though `git check-ignore` reports them as not ignored and `git ls-files`
# lists all 268 of them. The same mechanism is why the backend's .NET scan sees
# no frontend files either. The root cause is not understood — it is not
# .gitignore, .git/info/exclude, or core.excludesFile, all of which were ruled
# out by inspection.
#
# Turning the SCM filter off is safe *for this project specifically* because the
# analysed set is frontend/src only: everything there is tracked, and the files
# that filter legitimately protects (.env, appsettings.Development.json) live
# above this directory and are out of scope. Do not copy this line into the
# backend analysis, where that filter is what keeps untracked secrets out of
# SonarQube — verified: neither file reached the server.
sonar.scm.exclusions.disabled=true
