# Local development dependencies for StruoCMS.
#   docker compose up -d
# These credentials are for local development only — never reuse them anywhere else.
#
# Ports below default to the conventional values a clean machine expects. If any of them is
# already bound on your machine, override the host side without editing this tracked file:
# create a `.env` file next to this one (already gitignored) or export the variable in your
# shell, e.g.:
#   STRUO_PG_PORT=55432 docker compose up -d
# Variables: STRUO_PG_PORT (postgres, default 5432), STRUO_REDIS_PORT (redis, default 6379),
# STRUO_MINIO_PORT / STRUO_MINIO_CONSOLE_PORT (minio API/console, default 9000/9001).
services:
  postgres:
    image: postgres:17-alpine
    container_name: struo-postgres
    environment:
      POSTGRES_DB: struo
      POSTGRES_USER: struo
      POSTGRES_PASSWORD: struo
    ports:
      - "${STRUO_PG_PORT:-5432}:5432"
    volumes:
      - struo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U struo -d struo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: struo-redis
    ports:
      - "${STRUO_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. Only needed when Struo:Files:Backend is "s3";
  # the default "local" backend writes to App_Data/uploads and needs no container.
  # Pinned to an immutable release rather than :latest: upstream github.com/minio/minio was
  # archived on 2026-04-25 (users directed to AIStor), so the tag below is a deliberate,
  # reproducible choice — forks should make their own informed call rather than floating.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: struo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: struoadmin
      MINIO_ROOT_PASSWORD: struoadmin
    ports:
      - "${STRUO_MINIO_PORT:-9000}:9000"
      - "${STRUO_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - struo-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket the S3 backend expects, then exits.
  # `docker compose ps` shows it as Exited(0) once done — that is success.
  createbuckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 struoadmin struoadmin &&
      mc mb --ignore-existing local/struo-media &&
      echo 'bucket struo-media ready'
      "

volumes:
  struo-pgdata:
  struo-miniodata:
