<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StruoCMS Documentation</title>
    <link rel="stylesheet" href="theme.css" />
    <script>
      // Resolve the theme before docsify paints, so a dark-mode reader never sees a white flash.
      // localStorage access throws in some privacy modes, hence the try/catch.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('struo-docs-theme')
        } catch (error) {
          stored = null
        }
        var prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.setAttribute(
          'data-theme',
          stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light',
        )
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
      ☾
    </button>
    <script>
      window.$docsify = {
        name: 'StruoCMS',
        loadSidebar: true,
        loadNavbar: true,
        // Required. All 136 cross-chapter links in the manual are bare sibling filenames
        // ("09-rest-api.md"); without relativePath docsify resolves them against the site root and
        // every one of them 404s.
        relativePath: true,
        subMaxLevel: 2,
        auto2top: true,
        // The manual is developer-facing only. docs/ai/ and AGENTS.md are written for AI coding
        // agents and are intentionally absent from navigation and from the search index.
        search: {
          paths: 'auto',
          pathNamespaces: ['/guide/en', '/guide/zh-TW'],
          placeholder: 'Search',
          noData: 'No results.',
          depth: 3,
        },
      }
    </script>
    <script src="vendor/docsify.min.js"></script>
    <script src="vendor/plugins/search.min.js"></script>
    <script src="vendor/prism/prism-clike.min.js"></script>
    <script src="vendor/prism/prism-csharp.min.js"></script>
    <script src="vendor/prism/prism-typescript.min.js"></script>
    <script src="vendor/prism/prism-bash.min.js"></script>
    <script src="vendor/prism/prism-json.min.js"></script>
    <script src="vendor/prism/prism-yaml.min.js"></script>
    <script src="vendor/prism/prism-sql.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var button = document.getElementById('theme-toggle')
        var render = function () {
          var dark = document.documentElement.getAttribute('data-theme') === 'dark'
          button.textContent = dark ? '☀' : '☾'
          button.setAttribute('aria-pressed', String(dark))
        }
        button.addEventListener('click', function () {
          var next =
            document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
          document.documentElement.setAttribute('data-theme', next)
          try {
            localStorage.setItem('struo-docs-theme', next)
          } catch (error) {
            // Persistence unavailable; the toggle still works for this page load.
          }
          render()
        })
        render()
      })
    </script>
  </body>
</html>
