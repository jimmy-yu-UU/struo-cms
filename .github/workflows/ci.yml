name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # --ignore-scripts stops a dependency's postinstall from executing on the
      # runner. Verified locally that the suite and the build survive it: a
      # clean install with the flag still gives 689 passing tests and a working
      # `pnpm build`.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm build

  # `pnpm build` is the manual's gate, in three parts. `vitepress build` resolves
  # every cross-chapter link and fails on a dead one — nothing else in this repo
  # checks them. check-rendered-chapters.mjs then asserts every chapter actually
  # rendered: vitepress exits 0 even when a page comes out with an empty body, so
  # the exit code alone is not a gate. check-table-width.mjs finally fails any
  # table the content column cannot show without scrolling. `pnpm test` runs
  # the unit tests of check-table-width.mjs and its table-measuring library. A
  # few seconds of work in total.
  #
  # A fork that deleted docs/ has nothing to build. GitHub's hashFiles() cannot be
  # used in the job-level `if` (it is only available inside steps, and the workspace
  # does not exist yet at that point), so the first step after checkout looks for
  # docs/package.json and the later steps run only when it is there. The job then
  # passes without doing anything.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: docs
        working-directory: .
        run: |
          if [ -f docs/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "docs/package.json is absent; skipping the docs gates."
          fi
      - if: steps.docs.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - if: steps.docs.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      # Same reasoning as the frontend job: --ignore-scripts keeps a dependency's
      # postinstall from executing on the runner.
      - if: steps.docs.outputs.present == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: steps.docs.outputs.present == 'true'
        run: pnpm test
      - if: steps.docs.outputs.present == 'true'
        run: pnpm build

  # Builds the two container images (root Dockerfile for the API, frontend/Dockerfile
  # for the admin SPA) and smoke-tests each one, then smoke-tests the Compose stack
  # built from the same Dockerfiles. It is deliberately not a sixth standing gate:
  # contributors do not need Docker installed locally to work on this repo, so this
  # job only confirms the images build and boot in CI.
  #
  # Unlike the sonar-* jobs below, it needs no secret, so it runs the same way
  # for pull requests from forks and for Dependabot as it does for a normal push.
  #
  # The API refuses to start until migrations are applied, so the API smoke test
  # first runs the image with `migrate` against a SQLite file on a named volume,
  # then starts the API on the same volume. It then polls /health/ready rather
  # than /health/live, because /health/ready additionally exercises the
  # database and cache readiness checks; /health/live would pass even if
  # those were broken.
  #
  # The admin smoke test greps the served / for "assets/index-", the entry
  # chunk Vite emits by default -- deliberately stronger than grepping for
  # e.g. id="app", which the unbuilt source index.html also contains, so a
  # broken build that still serves the raw template would not pass silently.
  # If the entry chunk is ever renamed, update the grep to match.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: build-api
        run: docker build --tag struo-api:ci .
      - id: build-admin
        run: docker build --tag struo-admin:ci frontend
      # Both images are scanned on every run and fail the job on a HIGH or CRITICAL
      # finding that has an upstream fix. The SARIF copies feed the Security tab; only the upload
      # is skipped for Dependabot, fork PRs and private repositories, where code scanning may be off.
      - name: Scan struo-api:ci for fixable HIGH and CRITICAL vulnerabilities
        if: ${{ !cancelled() && steps.build-api.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: struo-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          cache-dir: ${{ runner.temp }}/trivy
      - name: Scan struo-admin:ci for fixable HIGH and CRITICAL vulnerabilities
        if: ${{ !cancelled() && steps.build-admin.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: struo-admin:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          cache-dir: ${{ runner.temp }}/trivy
      - name: Decide whether results can be uploaded to code scanning
        id: sarif-gate
        if: ${{ !cancelled() }}
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$PRIVATE_REPO" != "true" ] && [ "$ACTOR" != "dependabot[bot]" ] && { [ "$EVENT" != "pull_request" ] || [ "$HEAD_REPO" = "$THIS_REPO" ]; }; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the api scan as SARIF
        if: ${{ !cancelled() && steps.build-api.outcome == 'success' && steps.sarif-gate.outputs.upload == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: struo-api:ci
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          cache-dir: ${{ runner.temp }}/trivy
      - name: Upload the api scan to code scanning
        if: ${{ !cancelled() && steps.build-api.outcome == 'success' && steps.sarif-gate.outputs.upload == 'true' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api
      - name: Write the admin scan as SARIF
        if: ${{ !cancelled() && steps.build-admin.outcome == 'success' && steps.sarif-gate.outputs.upload == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: struo-admin:ci
          format: sarif
          output: trivy-admin.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          cache-dir: ${{ runner.temp }}/trivy
      - name: Upload the admin scan to code scanning
        if: ${{ !cancelled() && steps.build-admin.outcome == 'success' && steps.sarif-gate.outputs.upload == 'true' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-admin.sarif
          category: trivy-admin
      # The named volume is created from the image's /app/App_Data, so the non-root `app`
      # user can write the SQLite file in both containers.
      - name: Smoke-test the API image against SQLite
        run: |
          Auth__BootstrapAdmin__Password="$(openssl rand -hex 16)"
          export Auth__BootstrapAdmin__Password
          # A failed volume cleanup on the throwaway runner must not turn a passing smoke test red.
          trap 'docker rm --force api; docker volume rm struo-ci-data || true' EXIT
          db_env=(--env Database__DbType=Sqlite
                  --env Auth__BootstrapAdmin__Password
                  --env 'Database__ConnectionString=Data Source=/app/App_Data/struo-ci.db')
          docker volume create struo-ci-data
          docker run --rm --volume struo-ci-data:/app/App_Data "${db_env[@]}" struo-api:ci migrate
          docker run --detach --name api --publish 8080:8080 \
            --volume struo-ci-data:/app/App_Data "${db_env[@]}" struo-api:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
      - name: Smoke-test the admin image
        run: |
          trap 'docker rm --force admin' EXIT
          docker run --detach --name admin --publish 8081:8080 struo-admin:ci
          for _ in $(seq 1 15); do
            if curl --fail --silent http://localhost:8081/ | grep --quiet 'assets/index-'; then exit 0; fi
            sleep 1
          done
          docker logs admin
          exit 1
      # The compose stack builds its own images from the same Dockerfiles. It must
      # come up healthy, serve the built SPA, and proxy an anonymous API call through nginx.
      - name: Smoke-test the compose stack
        run: |
          STRUO_ADMIN_PASSWORD="$(openssl rand -hex 16)"
          export STRUO_ADMIN_PASSWORD
          trap 'rc=$?; if [ $rc -ne 0 ]; then docker compose ps --all; docker compose logs; fi; docker compose down --volumes' EXIT
          docker compose up --detach --build --wait --wait-timeout 300
          curl --fail --silent --show-error http://localhost:8081/health/ready
          curl --fail --silent --show-error http://localhost:8080/ | grep --quiet 'assets/index-'
          curl --fail --silent --show-error http://localhost:8080/api/config > /dev/null

  # The two jobs below report to SonarQube Cloud. They are deliberately separate
  # from the five standing gates above rather than wrapping them: the gates must
  # stay green or red on their own evidence, not on whether an external service
  # or its token happens to be reachable. The cost of that independence is one
  # extra build and test run.
  #
  # They are skipped for pull requests from forks, which cannot read secrets,
  # and for Dependabot, whose pull requests are handed a separate secret store
  # that SONAR_TOKEN is not in - they would run and then fail on an empty token.
  # Nothing is lost by skipping them there: Dependabot changes lockfiles and
  # version strings, so there are no new source lines for Sonar to judge, and
  # what actually catches a bad bump is the build and test run above, which
  # needs no secret and still runs. An undici major that removed a module jsdom
  # imports was caught exactly that way.
  #
  # To make a failing quality gate block a merge, mark these checks as required
  # in branch protection — no change to this file is needed.

  # Both jobs read the SonarQube Cloud organization and project keys from the
  # repository variables SONAR_ORGANIZATION, SONAR_BACKEND_PROJECT_KEY and
  # SONAR_FRONTEND_PROJECT_KEY, next to the SONAR_TOKEN secret. A repository
  # without SONAR_ORGANIZATION skips them.
  sonar-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      vars.SONAR_ORGANIZATION != ''
      && github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Sonar needs full history to attribute lines to commits and to work
          # out what counts as new code.
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # Versions come from .config/dotnet-tools.json, so a new release of either tool
      # reaches CI only through a reviewed change to that file.
      - run: dotnet tool restore
      - name: Resolve branch or pull request arguments
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            printf 'SONAR_ARGS=/d:sonar.pullrequest.key=%s /d:sonar.pullrequest.branch=%s /d:sonar.pullrequest.base=%s\n' \
              "$PR_NUMBER" "$HEAD_REF" "$BASE_REF" >> "$GITHUB_ENV"
          else
            printf 'SONAR_ARGS=/d:sonar.branch.name=%s\n' "$REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_BACKEND_PROJECT_KEY }}
        # $SONAR_ARGS is intentionally unquoted: it carries several arguments
        # and must word-split. It is built by the step above from environment
        # variables rather than by interpolating ${{ }} into the shell, so a
        # branch name cannot inject anything here.
        #
        # docs/ is excluded from coverage, not from analysis. The .NET scanner
        # indexes every file this project does not exclude, so the documentation
        # site's build tooling under docs/ lands in this project - there is no
        # third Sonar project for it. Its issues are still worth seeing, but the
        # only coverage report here is C# (coverage.xml), so those JS/TS lines
        # would otherwise count as new code at 0% and fail the gate. The ones
        # that have unit tests run them with node:test in the docs job above,
        # and no coverage file is produced, so excluding them from coverage
        # here is what keeps the gate honest.
        run: >
          dotnet dotnet-sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORG"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.exclusions="**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/.playwright-mcp/**,**/.sonarqube/**,frontend/**"
          /d:sonar.test.exclusions="frontend/**"
          /d:sonar.coverage.exclusions="docs/**"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"
          $SONAR_ARGS
      # The build has to sit between begin and end: the C# rules run as Roslyn
      # analyzers during compilation, which is why no snippet-level tool can
      # analyse this codebase.
      - run: dotnet build StruoCMS.slnx --configuration Release
      - run: dotnet dotnet-coverage collect "dotnet test StruoCMS.slnx --no-build --configuration Release" -f xml -o coverage.xml
      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet dotnet-sonarscanner end

  sonar-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      vars.SONAR_ORGANIZATION != ''
      && github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # --ignore-scripts stops a dependency's postinstall from executing on the
      # runner. Verified locally that the suite and the build survive it: a
      # clean install with the flag still gives 689 passing tests and a working
      # `pnpm build`.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Same suite as the `pnpm test` gate, re-run with the v8 coverage provider
      # so there is an lcov report for Sonar to import. Without a report Sonar
      # records 0% coverage, which is a statement about the report, not the tests.
      - run: pnpm vitest run --coverage --coverage.reporter=lcov
      - name: Resolve branch or pull request arguments
        id: sonar-args
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          SONAR_ORG: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_FRONTEND_PROJECT_KEY }}
        # The scan action parses `args` itself instead of handing it to a shell,
        # so a branch name placed in it cannot inject anything. The project key
        # and organization come from repository variables;
        # frontend/sonar-project.properties holds everything else.
        run: |
          args="-Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.organization=$SONAR_ORG"
          if [ "$EVENT" = pull_request ]; then
            args="$args -Dsonar.pullrequest.key=$PR_NUMBER -Dsonar.pullrequest.branch=$HEAD_REF -Dsonar.pullrequest.base=$BASE_REF"
          else
            args="$args -Dsonar.branch.name=$REF_NAME"
          fi
          printf 'args=%s\n' "$args" >> "$GITHUB_OUTPUT"
      # Pinned by SHA like every other action here; Dependabot's github-actions
      # entry moves it. projectBaseDir is needed because `defaults.run.working-directory`
      # applies to `run` steps only.
      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: frontend
          args: ${{ steps.sonar-args.outputs.args }}
