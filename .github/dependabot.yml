version: 2

# Every ecosystem below sets a cooldown. A compromised release is usually
# found and yanked within days of publication, so the window where an update
# is dangerous is also the window where it is newest — waiting is most of the
# defence. Dependabot already holds new versions for 3 days by default; these
# values make that explicit and widen it where the blast radius is larger.
#
# This delays nothing that matters urgently: cooldown applies to version
# updates only, never to security updates, so a published advisory still
# produces a pull request immediately.

updates:
  # The workflow pins every action to a commit SHA, which is what stops a
  # repointed tag from reaching these runners - and also what stops the actions
  # from ever updating on their own. This is the half that makes pinning
  # sustainable: Dependabot rewrites the SHA and the trailing version comment
  # together, so the pin stays readable while it moves.
  #
  # Only default-days here: the semver-aware cooldown keys are for ecosystems
  # that resolve semantic versions, and actions are pinned by commit.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # frontend/pnpm-workspace.yaml overrides transitive packages that their
  # dependents had not yet moved off. Dependabot cannot retire an override, but
  # it is what eventually makes retiring one possible: once jsdom and
  # @vue/compiler-sfc ship versions that already carry the patched transitives,
  # the corresponding entries can be deleted. Check that file whenever one of
  # these lands.
  #
  # Minor and patch arrive as a single grouped pull request, majors one at a
  # time - undici 7 to 8 broke the entire test suite, and that class of change
  # earns its own review.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # @tiptap/* packages in this family pin their peerDependencies to each
      # other by exact version, not a range - @tiptap/suggestion@3.30.2 depends
      # on '@tiptap/core': '3.30.2' and '@tiptap/pm': '3.30.2' verbatim, no
      # caret. A group that only covers minor/patch would let Dependabot open
      # one PR per package, and any PR that lands with the rest still on the
      # old patch leaves an unsatisfiable peer graph until the others catch up
      # - the exact failure mode that split this project's extension registry
      # in two before. Grouping the whole family, majors included, is what
      # makes "arrives as one PR or not at all" true; it has to come before
      # frontend-minor-patch below, since Dependabot assigns a dependency to
      # the first group whose patterns match it and frontend-minor-patch's
      # `patterns: ["*"]` would otherwise claim these first.
      tiptap:
        patterns: ["@tiptap/*"]
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # The docs site is its own npm project under docs/ — separate lockfile,
  # separate node_modules — so it needs its own entry; the /frontend one does not
  # reach it. Nothing here is redistributed (VitePress is a build-time tool and
  # none of its bytes are committed), so the blast radius is a developer machine
  # and a CI runner rather than a deployed artifact. Same cooldowns and the same
  # minor/patch grouping as the frontend, for the same reasons.
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      docs-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Backend versions are centralised in Directory.Packages.props, which is the
  # file this reads. Leaving NuGet out would not have left the backend
  # unprotected - Dependabot's security updates cover an ecosystem whether or
  # not it is listed here - but it would have meant the backend moved only when
  # something was found to be vulnerable, and drifted the rest of the time until
  # an upgrade spanned several majors at once. HtmlSanitizer sat pinned to a
  # beta for weeks and it took a manual audit to notice; that is the class of
  # thing this catches. It matters more than usual for a template, where a fork
  # inherits whatever pins it was cloned with.
  #
  # Same split as the frontend: minor and patch grouped, majors alone. The
  # 1,012-test suite is what stands behind either one.
  #
  # global.json is not covered - the SDK version there still moves by hand.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Microsoft.OpenApi 3.x cannot be used from .NET 10 at all. The pin exists
      # only as a security floor (see Directory.Packages.props); the ceiling is
      # upstream's. Microsoft.AspNetCore.OpenApi 10.0.10 declares a bare
      # `>= 2.0.0` floor with no upper bound, so NuGet resolves 3.x happily, and
      # then its own XmlCommentGenerator emits code that assigns to
      # IOpenApiMediaType.Example - read-only in 3.x - and the build fails on two
      # errors in a generated file no fork can edit. Suppressing the generator
      # would only trade that for a runtime failure: the shipped assembly is
      # compiled against 2.x. Without this rule Dependabot re-proposes the major
      # on every cooldown expiry.
      #
      # Delete this once the project moves to .NET 11, where
      # Microsoft.AspNetCore.OpenApi 11.0.x ships against Microsoft.OpenApi 3.x.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
